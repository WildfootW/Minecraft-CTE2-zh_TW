name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build resource pack and full installer bundle
        shell: pwsh
        run: ./setup.ps1 -BuildFull

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CTE2-v1.1.3-zh_tw-WildfootW
          path: dist/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
